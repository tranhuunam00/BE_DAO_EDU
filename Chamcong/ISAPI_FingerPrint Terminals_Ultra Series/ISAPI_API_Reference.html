<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hikvision ISAPI API Reference - Ultra Series</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-sidebar: #101626;
            --bg-card: #131b2e;
            --bg-code: #182238;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-color-active: rgba(59, 130, 246, 0.4);
            
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-link: #3b82f6;
            
            --color-get: #10b981;
            --color-post: #3b82f6;
            --color-put: #f59e0b;
            --color-delete: #ef4444;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-glow: 0 0 20px rgba(59, 130, 246, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100%;
        }
        
        .sidebar-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .sidebar-header p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .chapter-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .chapter-item {
            margin-bottom: 8px;
        }

        .chapter-btn {
            width: 100%;
            text-align: left;
            background: none;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chapter-btn:hover {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
        }

        .chapter-btn.active {
            background-color: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            border-color: rgba(59, 130, 246, 0.2);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.05);
        }

        .chapter-count {
            font-size: 11px;
            background-color: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            padding: 2px 6px;
            border-radius: 12px;
        }
        
        .chapter-btn.active .chapter-count {
            background-color: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
        }

        /* Main Content Styling */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-main);
        }

        .top-bar {
            padding: 20px 32px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: rgba(16, 22, 38, 0.5);
            backdrop-filter: blur(10px);
        }

        .search-row {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
        }

        .search-input {
            width: 100%;
            background-color: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px 12px 40px;
            color: var(--text-main);
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--border-color-active);
            box-shadow: var(--shadow-glow);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .method-filters {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            background-color: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
        }

        .filter-btn.active[data-method="ALL"] {
            background-color: var(--text-main);
            color: var(--bg-main);
            border-color: var(--text-main);
        }

        .filter-btn.active[data-method="GET"] {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--color-get);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .filter-btn.active[data-method="POST"] {
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--color-post);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .filter-btn.active[data-method="PUT"] {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--color-put);
            border-color: rgba(245, 158, 11, 0.3);
        }

        .filter-btn.active[data-method="DELETE"] {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--color-delete);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .stats-row {
            display: flex;
            gap: 24px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .stat-item span {
            color: var(--text-main);
            font-weight: 600;
        }

        /* API Grid / Card List */
        .api-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
        }

        .api-cards-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .api-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .api-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 16px;
        }

        .card-title-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .method-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .method-badge.get {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--color-get);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .method-badge.post {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--color-post);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .method-badge.put {
            background-color: rgba(245, 158, 11, 0.1);
            color: var(--color-put);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .method-badge.delete {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--color-delete);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .api-path {
            font-family: 'Fira Code', monospace;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-main);
            word-break: break-all;
        }

        .api-path span.placeholder {
            color: #fb923c;
            font-weight: 600;
        }

        .meta-badges {
            display: flex;
            gap: 8px;
        }

        .meta-badge {
            font-size: 11px;
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .meta-badge.formal {
            background-color: rgba(59, 130, 246, 0.06);
            color: #93c5fd;
            border-color: rgba(59, 130, 246, 0.15);
        }

        .meta-badge.informal {
            background-color: rgba(245, 158, 11, 0.04);
            color: #fde047;
            border-color: rgba(245, 158, 11, 0.1);
        }

        .breadcrumb-row {
            margin-bottom: 12px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .breadcrumb-row span.sep {
            color: rgba(255, 255, 255, 0.2);
        }

        .api-description {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 16px;
            border-left: 3px solid rgba(255, 255, 255, 0.1);
            padding-left: 12px;
        }

        /* Payload / Code Sections */
        .collapsible-container {
            margin-top: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--bg-code);
        }

        .collapsible-trigger {
            width: 100%;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 16px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .collapsible-trigger:hover {
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--text-main);
        }

        .collapsible-trigger span.icon {
            font-size: 10px;
            transition: transform 0.2s ease;
        }

        .collapsible-container.open .collapsible-trigger span.icon {
            transform: rotate(180deg);
        }

        .collapsible-content {
            display: none;
            padding: 16px;
            border-top: 1px solid var(--border-color);
            overflow-x: auto;
            max-height: 350px;
        }

        .collapsible-container.open .collapsible-content {
            display: block;
        }

        pre {
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: #e2e8f0;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Copy Button and Action Buttons */
        .card-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .action-btn {
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        /* Scrollbars styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--text-muted);
            text-align: center;
        }

        .empty-state h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        /* Query Parameter Box */
        .query-box {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 12px;
            font-size: 12px;
            font-family: 'Fira Code', monospace;
            color: #93c5fd;
        }

        /* Responsive Breakpoint */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: 250px;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }

            .api-list-container {
                padding: 16px;
            }

            .top-bar {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-container">
            <div class="sidebar-header">
                <h1>ISAPI Ultra Series</h1>
                <p>Fingerprint Terminals API Catalog</p>
            </div>
            <div class="chapter-list" id="chapter-list">
                <!-- Chapters will be rendered here dynamically -->
            </div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="top-bar">
            <div class="search-row">
                <div class="search-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="search-input" placeholder="Search API path, description, parameters...">
                </div>
                <div class="method-filters" id="method-filters">
                    <button class="filter-btn active" data-method="ALL">ALL</button>
                    <button class="filter-btn" data-method="GET">GET</button>
                    <button class="filter-btn" data-method="POST">POST</button>
                    <button class="filter-btn" data-method="PUT">PUT</button>
                    <button class="filter-btn" data-method="DELETE">DELETE</button>
                </div>
            </div>
            <div class="stats-row">
                <div class="stat-item">Total APIs: <span id="stat-total">0</span></div>
                <div class="stat-item">GET: <span id="stat-get" style="color: var(--color-get)">0</span></div>
                <div class="stat-item">POST: <span id="stat-post" style="color: var(--color-post)">0</span></div>
                <div class="stat-item">PUT: <span id="stat-put" style="color: var(--color-put)">0</span></div>
                <div class="stat-item">DELETE: <span id="stat-delete" style="color: var(--color-delete)">0</span></div>
                <div class="stat-item">Formal Schemas: <span id="stat-formal" style="color: #93c5fd">0</span></div>
            </div>
        </div>
        
        <div class="api-list-container">
            <div class="api-cards-grid" id="api-cards-grid">
                <!-- API cards will be rendered here dynamically -->
            </div>
        </div>
    </div>

        let selectedChapter = "ALL";
        let selectedMethod = "ALL";
        let searchQuery = "";

        // Elements
        const chapterListEl = document.getElementById("chapter-list");
        const apiCardsGridEl = document.getElementById("api-cards-grid");
        const searchInputEl = document.getElementById("search-input");
        const methodFiltersEl = document.getElementById("method-filters");
        
        // Stat elements
        const statTotalEl = document.getElementById("stat-total");
        const statGetEl = document.getElementById("stat-get");
        const statPostEl = document.getElementById("stat-post");
        const statPutEl = document.getElementById("stat-put");
        const statDeleteEl = document.getElementById("stat-delete");
        const statFormalEl = document.getElementById("stat-formal");

        // Format path placeholders visually
        function formatPath(path) {
            // Replace <something> with span placeholder
            let formatted = path.replace(/&lt;([^&>]+)&gt;/g, '<span class="placeholder">&lt;$1&gt;</span>');
            formatted = formatted.replace(/\{([^\}]+)\}/g, '<span class="placeholder">{$1}</span>');
            return formatted;
        }

        // Initialize Stats
        function updateStats(filteredApis) {
            const total = filteredApis.length;
            const gets = filteredApis.filter(a => a.method === "GET").length;
            const posts = filteredApis.filter(a => a.method === "POST").length;
            const puts = filteredApis.filter(a => a.method === "PUT").length;
            const deletes = filteredApis.filter(a => a.method === "DELETE").length;
            const formal = filteredApis.filter(a => a.is_formal).length;

            statTotalEl.textContent = total;
            statGetEl.textContent = gets;
            statPostEl.textContent = posts;
            statPutEl.textContent = puts;
            statDeleteEl.textContent = deletes;
            statFormalEl.textContent = formal;
        }

        // Render Sidebar Chapters
        function renderSidebar() {
            // Count APIs per chapter
            const counts = { "ALL": API_DATA.length };
            API_DATA.forEach(api => {
                const chapter = api.hierarchy[0] || "General";
                counts[chapter] = (counts[chapter] || 0) + 1;
            });

            const chapters = ["ALL", ...Object.keys(counts).filter(c => c !== "ALL").sort()];
            
            chapterListEl.innerHTML = "";
            chapters.forEach(chap => {
                const btn = document.createElement("button");
                btn.className = `chapter-btn ${chap === selectedChapter ? 'active' : ''}`;
                btn.onclick = () => selectChapter(chap);
                
                // Truncate chapter title for display if too long, but keep it neat
                let displayTitle = chap;
                if (chap !== "ALL" && chap.length > 32) {
                    displayTitle = chap.substring(0, 30) + "...";
                }
                
                btn.innerHTML = `
                    <span title="${chap}">${displayTitle}</span>
                    <span class="chapter-count">${counts[chap]}</span>
                `;
                chapterListEl.appendChild(btn);
            });
        }

        function selectChapter(chapter) {
            selectedChapter = chapter;
            renderSidebar();
            filterAndRenderAPIs();
        }

        // Copy text helper
        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = "📋 Copied!";
                btn.style.borderColor = "var(--color-get)";
                btn.style.color = "var(--color-get)";
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.borderColor = "";
                    btn.style.color = "";
                }, 1500);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        }

        // Render Cards
        function renderAPICards(apisList) {
            apiCardsGridEl.innerHTML = "";
            
            if (apisList.length === 0) {
                apiCardsGridEl.innerHTML = `
                    <div class="empty-state">
                        <h3>No API Endpoints Found</h3>
                        <p>Try refining your search keywords or resetting filters.</p>
                    </div>
                `;
                return;
            }

            apisList.forEach((api, index) => {
                const card = document.createElement("div");
                card.className = "api-card";
                
                const methodClass = api.method.toLowerCase();
                const pathHtml = formatPath(escapeHtml(api.base_path));
                const hierarchyPath = api.hierarchy.join(" <span class='sep'>&gt;</span> ");
                
                // Build queries description
                let queryHtml = "";
                if (api.query) {
                    queryHtml = `<div class="query-box">Query Params: ${escapeHtml(api.query)}</div>`;
                }

                // Generate Collapsible payload containers if payloads exist
                let payloadHtml = "";
                if (api.request_msg && api.request_msg !== "None" && api.request_msg.trim() !== "") {
                    payloadHtml += `
                        <div class="collapsible-container" id="req-msg-container-${index}">
                            <button class="collapsible-trigger" onclick="toggleCollapsible('req-msg-container-${index}')">
                                <span>Request Message Payload (JSON/XML)</span>
                                <span class="icon">▼</span>
                            </button>
                            <div class="collapsible-content">
                                <pre><code>${escapeHtml(api.request_msg)}</code></pre>
                            </div>
                        </div>
                    `;
                }

                if (api.response_msg && api.response_msg !== "None" && api.response_msg.trim() !== "") {
                    payloadHtml += `
                        <div class="collapsible-container" id="res-msg-container-${index}">
                            <button class="collapsible-trigger" onclick="toggleCollapsible('res-msg-container-${index}')">
                                <span>Response Message Payload (JSON/XML)</span>
                                <span class="icon">▼</span>
                            </button>
                            <div class="collapsible-content">
                                <pre><code>${escapeHtml(api.response_msg)}</code></pre>
                            </div>
                        </div>
                    `;
                }

                // Description logic
                let desc = api.query_desc || "No detailed description available.";
                if (desc.toLowerCase().startsWith("none") || desc === "") {
                    desc = "API endpoint defined in the " + (api.hierarchy[api.hierarchy.length - 1] || "general") + " section.";
                }

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title-row">
                            <span class="method-badge ${methodClass}">${api.method}</span>
                            <span class="api-path">${pathHtml}</span>
                        </div>
                        <div class="meta-badges">
                            <span class="meta-badge ${api.is_formal ? 'formal' : 'informal'}">
                                ${api.is_formal ? '✓ Full Specification' : 'ℹ Text Reference'}
                            </span>
                            <span class="meta-badge">PDF Page ${api.page}</span>
                        </div>
                    </div>
                    <div class="breadcrumb-row">
                        ${hierarchyPath}
                    </div>
                    <div class="api-description">
                        ${escapeHtml(desc).replace(/\n/g, '<br>')}
                    </div>
                    ${queryHtml}
                    ${payloadHtml}
                    <div class="card-actions">
                        <button class="action-btn" onclick="copyToClipboard('${api.method} ${api.base_path}', this)">
                            📋 Copy Command
                        </button>
                        <button class="action-btn" onclick="copyToClipboard('${api.base_path}', this)">
                            🔗 Copy Path
                        </button>
                    </div>
                `;
                apiCardsGridEl.appendChild(card);
            });
        }

        function toggleCollapsible(containerId) {
            const el = document.getElementById(containerId);
            el.classList.toggle("open");
        }

        function escapeHtml(text) {
            if (!text) return "";
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Filter and Search Logic
        function filterAndRenderAPIs() {
            let filtered = API_DATA;

            // 1. Chapter Filter
            if (selectedChapter !== "ALL") {
                filtered = filtered.filter(api => {
                    const chapter = api.hierarchy[0] || "General";
                    return chapter === selectedChapter;
                });
            }

            // 2. Method Filter
            if (selectedMethod !== "ALL") {
                filtered = filtered.filter(api => api.method === selectedMethod);
            }

            // 3. Search Filter
            if (searchQuery.trim() !== "") {
                const query = searchQuery.toLowerCase().trim();
                filtered = filtered.filter(api => {
                    const path = api.base_path.toLowerCase();
                    const desc = (api.query_desc || "").toLowerCase();
                    const req = (api.request_msg || "").toLowerCase();
                    const res = (api.response_msg || "").toLowerCase();
                    const queryStr = (api.query || "").toLowerCase();
                    const hierarchy = api.hierarchy.join(" ").toLowerCase();
                    
                    return path.includes(query) || 
                           desc.includes(query) || 
                           req.includes(query) || 
                           res.includes(query) || 
                           queryStr.includes(query) ||
                           hierarchy.includes(query);
                });
            }

            updateStats(filtered);
            renderAPICards(filtered);
        }

        // Bind events
        searchInputEl.addEventListener("input", (e) => {
            searchQuery = e.target.value;
            filterAndRenderAPIs();
        });

        methodFiltersEl.addEventListener("click", (e) => {
            if (e.target.classList.contains("filter-btn")) {
                // Update active class
                Array.from(methodFiltersEl.children).forEach(btn => btn.classList.remove("active"));
                e.target.classList.add("active");
                
                selectedMethod = e.target.getAttribute("data-method");
                filterAndRenderAPIs();
            }
        });

        // Keyboard shortcut for search
        document.addEventListener("keydown", (e) => {
            if (e.key === "/" && document.activeElement !== searchInputEl) {
                e.preventDefault();
                searchInputEl.focus();
                searchInputEl.select();
            }
        });

        // Init
        renderSidebar();
        filterAndRenderAPIs();
    </script>
</body>
</html>
